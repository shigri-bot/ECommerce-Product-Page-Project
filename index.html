<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Product Page</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<!-- FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<nav>
    <div class="logo">ShopMate</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="cart-icon">
        <i class="fa fa-shopping-cart"></i> <span id="cartCount">0</span>
    </div>	
</nav>


<!-- FILTER & SORT -->
<section class="controls">
    <div class="filter">
        <label>Filter by Category:</label>
        <select id="categoryFilter">
            <option value="all">All</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="home">Home</option>
        </select>
    </div>
    <div class="sort">
        <label>Sort by:</label>
        <select id="sortProducts">
            <option value="default">Default</option>
            <option value="priceLow">Price: Low to High</option>
            <option value="priceHigh">Price: High to Low</option>
            <option value="nameAsc">Name: A-Z</option>
            <option value="nameDesc">Name: Z-A</option>
        </select>
    </div>
</section>

<!-- PRODUCT GRID -->
<section class="product-grid" id="productGrid">
    <!-- Products will be dynamically inserted -->
</section>

<!-- CART MODAL -->
<div class="cart-modal" id="cartModal">
    <h2>Shopping Cart</h2>
    <ul id="cartItems"></ul>
    <p>Total: $<span id="cartTotal">0.00</span></p>
    <button id="checkoutBtn" class="btn">Checkout</button>
    <button id="closeCart" class="btn btn-outline">Close</button>
</div>

<!-- FOOTER -->
<footer>
    <p>&copy; 2025 ShopMate. All Rights Reserved.</p>
</footer>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
